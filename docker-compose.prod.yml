services:
  postgres:
    image: postgres:16-alpine
    container_name: japan-trip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-japan_trip}
      POSTGRES_USER: ${POSTGRES_USER:-japan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-japan} -d ${POSTGRES_DB:-japan_trip}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: japan-trip-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 4000
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-japan_trip}
      JDBC_DATABASE_USERNAME: ${POSTGRES_USER:-japan}
      JDBC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_CORS_ORIGIN: ${APP_CORS_ORIGIN:?APP_CORS_ORIGIN is required}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_API_MONTHLY_LIMITS: ${GOOGLE_API_MONTHLY_LIMITS:-}
      GOOGLE_API_DAILY_LIMITS: ${GOOGLE_API_DAILY_LIMITS:-}
    expose:
      - "4000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: japan-trip-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_HTTP_PORT:-8080}:80"

volumes:
  postgres-data:
