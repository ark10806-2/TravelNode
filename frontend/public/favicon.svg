      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.26"/>
    </filter>
    <clipPath id="clip">
      <rect x="8" y="8" width="80" height="80" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="8" y="8" width="80" height="80" rx="24" fill="url(#bg)"/>
    <rect x="8" y="8" width="80" height="80" rx="24" fill="url(#shine)"/>
    <rect x="8" y="8" width="80" height="80" rx="24" filter="url(#grain)" opacity="0.55"/>
