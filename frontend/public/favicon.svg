<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Japan Trip Planner">
  <defs>
    <linearGradient id="bg" x1="18" y1="10" x2="82" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5AA7FF"/>
      <stop offset="0.48" stop-color="#3182F6"/>
      <stop offset="1" stop-color="#1769E0"/>
    </linearGradient>
    <radialGradient id="shine" cx="32" cy="22" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.48"/>
      <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <filter id="planeShadow" x="-35%" y="-35%" width="170%" height="170%">
