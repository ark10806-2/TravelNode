<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Japan Trip Planner">
  <style>
    .dark-surface,
    .dark-glow {
      opacity: 0;
    }

    @media (prefers-color-scheme: dark) {
      .light-surface,
      .light-glow {
        opacity: 0;
      }

      .dark-surface,
      .dark-glow {
        opacity: 1;
      }

      .tile-outline {
        stroke: rgba(255, 255, 255, 0.12);
      }
    }
  </style>
  <defs>
    <linearGradient id="lightSurface" x1="18" y1="10" x2="76" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F7FB"/>
    </linearGradient>
    <linearGradient id="darkSurface" x1="18" y1="10" x2="76" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#202735"/>
      <stop offset="0.52" stop-color="#121826"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="wing" x1="22" y1="30" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#19C8FF"/>
      <stop offset="0.5" stop-color="#0088FF"/>
      <stop offset="1" stop-color="#0057FF"/>
    </linearGradient>
    <linearGradient id="blade" x1="54" y1="18" x2="78" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25D0FF"/>
      <stop offset="0.45" stop-color="#006DFF"/>
      <stop offset="1" stop-color="#003FE8"/>
    </linearGradient>
    <linearGradient id="crease" x1="50" y1="73" x2="66" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.42" stop-color="#9DE7FF" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="tileShadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="planeShadow" x="-28%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#0057FF" flood-opacity="0.26"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.28"/>
    </filter>
    <clipPath id="clip">
      <rect x="8" y="8" width="80" height="80" rx="24"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="80" height="80" rx="24" fill="#FFFFFF" filter="url(#tileShadow)"/>
  <g clip-path="url(#clip)">
    <rect class="light-surface" x="8" y="8" width="80" height="80" rx="24" fill="url(#lightSurface)"/>
    <rect class="dark-surface" x="8" y="8" width="80" height="80" rx="24" fill="url(#darkSurface)"/>
    <circle class="light-glow" cx="27" cy="20" r="26" fill="#FFFFFF" opacity="0.62"/>
    <circle class="dark-glow" cx="67" cy="76" r="28" fill="#0057FF" opacity="0.08"/>
  </g>
  <rect class="tile-outline" x="8.75" y="8.75" width="78.5" height="78.5" rx="23.25" fill="none" stroke="#E2E8F0" stroke-opacity="0.7" stroke-width="1.5"/>

  <g filter="url(#planeShadow)">
    <path
      d="M19.8 55.6C17.7 48.6 25.8 37.4 39.2 30.2C50 24.4 63.2 21.7 77.3 23.4C66.3 35.2 55.3 47.5 45.2 58.8C34.4 62.1 23.2 60.9 19.8 55.6Z"
      fill="url(#wing)"
    />
    <path
      d="M77.3 23.4C77.1 38.9 70.9 60.3 55.8 77.2C51.4 74.8 48.9 70.6 49.8 65.8C54.2 50.2 63.7 34.5 77.3 23.4Z"
      fill="url(#blade)"
    />
    <path
      d="M75.2 25.4C64.8 38.9 55.2 55.1 51.4 74.6"
      fill="none"
      stroke="url(#crease)"
      stroke-linecap="round"
      stroke-width="2.8"
    />
    <path
      d="M24.7 53.2C38.5 47.7 52.7 37.7 72.6 24.6"
      fill="none"
      stroke="#FFFFFF"
      stroke-linecap="round"
      stroke-opacity="0.18"
      stroke-width="2.2"
    />
  </g>
</svg>
