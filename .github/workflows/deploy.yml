name: Deploy to Mac mini

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: travel-node-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - macOS
      - travel-node
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: TRAVEL_NODE_ENV_FILE="$HOME/.config/travel-node/.env.production" ./deploy/deploy.sh
