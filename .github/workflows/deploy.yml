name: Deploy to Mac mini

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: travel-node-production
  cancel-in-progress: true

jobs:
  deploy:
    environment: production
    runs-on:
      - self-hosted
      - macOS
      - travel-node
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Unlock macOS keychain
        env:
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$MACOS_KEYCHAIN_PASSWORD" ]; then
            echo "MACOS_KEYCHAIN_PASSWORD repository secret is required for Docker Desktop on macOS."
            exit 1
          fi
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$HOME/Library/Keychains/login.keychain-db"
          security set-keychain-settings -lut 21600 "$HOME/Library/Keychains/login.keychain-db"

      - name: Deploy
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY secret is required in the production environment or repository secrets."
            exit 1
          fi
          TRAVEL_NODE_ENV_FILE="$HOME/.config/travel-node/.env.production" ./deploy/deploy.sh
