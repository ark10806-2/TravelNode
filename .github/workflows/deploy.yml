name: Deploy to Mac mini

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: japan-trip-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - macOS
      - japan-trip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: JAPAN_TRIP_ENV_FILE="$HOME/.config/japan-trip/.env.production" ./deploy/deploy.sh
